
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sistem Bilangan</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow mx-auto" style="max-width: 600px;">
            <div class="card-header bg-primary text-white text-center">
                <h3>Kalkulator Sistem Bilangan</h3>
            </div>

            <div class="card-body p-4">

                <!-- Input Bilangan -->
                <div class="mb-3">
                    <label for="bilangan" class="form-label">
                        Masukkan Bilangan
                    </label>
                    <input type="text" id="bilangan" class="form-control"
                           placeholder="Contoh: 1010">
                </div>

                <!-- Sistem Bilangan Asal -->
                <div class="mb-3">
                    <label for="asal" class="form-label">
                        Dari Sistem Bilangan
                    </label>
                    <select id="asal" class="form-select">
                        <option value="2">Biner (Basis 2)</option>
                        <option value="8">Oktal (Basis 8)</option>
                        <option value="10" selected>Desimal (Basis 10)</option>
                        <option value="16">Heksadesimal (Basis 16)</option>
                    </select>
                </div>

                <!-- Sistem Bilangan Tujuan -->
                <div class="mb-3">
                    <label for="tujuan" class="form-label">
                        Ke Sistem Bilangan
                    </label>
                    <select id="tujuan" class="form-select">
                        <option value="2">Biner (Basis 2)</option>
                        <option value="8">Oktal (Basis 8)</option>
                        <option value="10">Desimal (Basis 10)</option>
                        <option value="16" selected>
                            Heksadesimal (Basis 16)
                        </option>
                    </select>
                </div>

                <!-- Tombol Konversi -->
                <div class="d-grid mb-3">
                    <button class="btn btn-primary"
                            onclick="konversikan()">
                        Konversi
                    </button>
                </div>

                <!-- Hasil Konversi -->
                <div class="text-center mt-4">
                    <label class="form-label">Hasil Konversi</label>
                    <h2 id="hasil" class="text-success fw-bold">
                        -
                    </h2>
                    <p id="pesan" class="text-danger mb-0"></p>
                </div>

            </div>
        </div>
    </div>

    <script>
        function konversikan() {
            const bilangan = document.getElementById("bilangan")
                .value.trim();

            const asal = parseInt(
                document.getElementById("asal").value
            );

            const tujuan = parseInt(
                document.getElementById("tujuan").value
            );

            const hasil = document.getElementById("hasil");
            const pesan = document.getElementById("pesan");

            pesan.textContent = "";
            hasil.textContent = "-";

            if (bilangan === "") {
                pesan.textContent = "Masukkan bilangan terlebih dahulu!";
                return;
            }

            // Validasi bilangan sesuai basis asal
            const digitValid = {
                2: /^[01]+$/,
                8: /^[0-7]+$/,
                10: /^[0-9]+$/,
                16: /^[0-9a-fA-F]+$/
            };

            if (!digitValid[asal].test(bilangan)) {
                pesan.textContent =
                    "Bilangan tidak valid untuk sistem bilangan asal!";
                return;
            }

            // Konversi ke desimal terlebih dahulu
            const desimal = parseInt(bilangan, asal);

            // Konversi desimal ke basis tujuan
            const hasilKonversi = desimal
                .toString(tujuan)
                .toUpperCase();

            hasil.textContent = hasilKonversi;
        }
    </script>

</body>
</html>
